name: Python checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m py_compile mainTrain.py mainTest.py prediction.py gui_test.py
      - name: Check trailing whitespace
        run: |
          if grep -RIn --exclude-dir=.git --exclude='*.zip' --exclude='*.h5' '[[:blank:]]$' .; then
            echo "Trailing whitespace found"
            exit 1
          fi
